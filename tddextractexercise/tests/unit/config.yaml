type: local

logger:
    console:
        level: INFO

cognite:
    host: https://example.cognitedata.com
    project: test-project
    idp-authentication:
        token-url: https://login.example.com/token
        client-id: test-client-id
        secret: test-secret
        scopes:
            - https://example.cognitedata.com/.default

source:
    database: TEST_RAW_DATABASE
    table: TEST_METADATA_TABLE

target:
    database: TEST_RAW_TARGET
    table: TEST_METADATA_TABLE

target_space:
    space: isp_Target
    name: isp_Target
    description: Target space for DMS extractor files
